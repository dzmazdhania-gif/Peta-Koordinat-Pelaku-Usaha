<script>

/* ============================================================
   KONFIGURASI
============================================================ */

const EXCEL_FILE =
    "DATA PENGAWASAN DIT. PSDK (only long lat).xlsx";

let allData = [];
let validData = [];
let markerLayer;


/* ============================================================
   NAMA KOLOM EXCEL
============================================================ */

const COL = {

    no:
        "NO.",

    usaha:
        "PELAKU USAHA",

    lokasi:
        "LOKASI",

    pelanggaran:
        "INDIKASI   PELANGGARAN",

    upt:
        "UPT PSDKP",

    longitude:
        "LONG (decimal)",

    latitude:
        "LAT (decimal)",

    tl:
        "TL PENGAWASAN",

    kegiatan:
        "BENTUK KEGIATAN"

};


/* ============================================================
   INITIAL MAP
============================================================ */

const map = L.map("map", {
    zoomControl: true
});


/* ============================================================
   BASEMAP
============================================================ */

const osm = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);


const satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
        maxZoom: 19,
        attribution:
            "Tiles &copy; Esri"
    }
);


const light = L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
    {
        maxZoom: 20,
        attribution:
            "&copy; CARTO"
    }
);


L.control.layers(
    {
        "OpenStreetMap": osm,
        "Satellite": satellite,
        "Light": light
    }
).addTo(map);


/* Tampilan awal Indonesia */

map.setView(
    [-2.5, 118],
    5
);


/* ============================================================
   LOAD EXCEL
============================================================ */

async function loadExcel() {

    document
        .getElementById("loading")
        .style.display = "block";


    try {

        const response =
            await fetch(EXCEL_FILE);


        if (!response.ok) {

            throw new Error(
                "File Excel tidak ditemukan."
            );

        }


        const arrayBuffer =
            await response.arrayBuffer();


        const workbook =
            XLSX.read(
                arrayBuffer,
                {
                    type: "array"
                }
            );


        console.log(
            "Sheet Excel:",
            workbook.SheetNames
        );


        /*
         * Ambil sheet pertama.
         *
         * Kalau Excel hanya memiliki
         * satu sheet, langsung digunakan.
         */

        const sheetName =
            workbook.SheetNames[0];


        const worksheet =
            workbook.Sheets[sheetName];


        allData =
            XLSX.utils.sheet_to_json(
                worksheet,
                {
                    defval: ""
                }
            );


        console.log(
            "Sheet digunakan:",
            sheetName
        );


        console.log(
            "Jumlah seluruh baris:",
            allData.length
        );


        /*
         * Cek struktur kolom
         */

        if (
            allData.length === 0
        ) {

            throw new Error(
                "Excel tidak memiliki data."
            );

        }


        console.log(
            "Kolom Excel:",
            Object.keys(allData[0])
        );


        processData();

    }

    catch(error) {

        console.error(
            "ERROR:",
            error
        );


        document
            .getElementById("status")
            .innerText =
                "Gagal memuat data";


        alert(
            "Gagal membaca Excel.\n\n" +
            error.message +
            "\n\nPastikan file berikut berada di folder yang sama dengan index.html:\n\n" +
            EXCEL_FILE
        );

    }

    finally {

        document
            .getElementById("loading")
            .style.display = "none";

    }

}


/* ============================================================
   PROCESS DATA
============================================================ */

function processData() {


    /*
     * Pastikan kolom utama tersedia
     */

    const requiredColumns = [

        COL.no,
        COL.usaha,
        COL.lokasi,
        COL.pelanggaran,
        COL.upt,
        COL.longitude,
        COL.latitude,
        COL.tl,
        COL.kegiatan

    ];


    const actualColumns =
        Object.keys(
            allData[0]
        );


    const missingColumns =
        requiredColumns.filter(
            column =>
                !actualColumns.includes(
                    column
                )
        );


    if (
        missingColumns.length > 0
    ) {

        console.error(
            "Kolom tidak ditemukan:",
            missingColumns
        );


        alert(
            "Ada kolom Excel yang tidak ditemukan:\n\n" +
            missingColumns.join("\n") +
            "\n\nLihat Console Browser (F12) untuk daftar kolom yang terbaca."
        );


        return;

    }


    /*
     * Konversi koordinat
     */

    validData =
        allData.filter(
            row => {

                const longitude =
                    parseFloat(
                        String(
                            row[
                                COL.longitude
                            ]
                        )
                        .replace(",", ".")
                    );


                const latitude =
                    parseFloat(
                        String(
                            row[
                                COL.latitude
                            ]
                        )
                        .replace(",", ".")
                    );


                return (

                    Number.isFinite(
                        longitude
                    )

                    &&

                    Number.isFinite(
                        latitude
                    )

                    &&

                    latitude >= -90

                    &&

                    latitude <= 90

                    &&

                    longitude >= -180

                    &&

                    longitude <= 180

                );

            }
        );


    console.log(
        "Total data:",
        allData.length
    );


    console.log(
        "Data dengan koordinat:",
        validData.length
    );


    console.log(
        "Data tanpa koordinat:",
        allData.length -
        validData.length
    );


    /*
     * Statistik total lokasi
     */

    document
        .getElementById("totalData")
        .innerText =
            validData.length;


    /*
     * Hitung jumlah UPT unik
     */

    const uptSet =
        new Set();


    validData.forEach(
        row => {

            const upt =
                String(
                    row[
                        COL.upt
                    ] || ""
                ).trim();


            if (upt) {

                uptSet.add(
                    upt
                );

            }

        }
    );


    document
        .getElementById("totalUPT")
        .innerText =
            uptSet.size;


    /*
     * Isi dropdown UPT
     */

    const uptFilter =
        document.getElementById(
            "uptFilter"
        );


    [...uptSet]
        .sort()
        .forEach(
            upt => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    upt;


                option.textContent =
                    upt;


                uptFilter.appendChild(
                    option
                );

            }
        );


    /*
     * Render marker
     */

    renderMarkers(
        validData
    );


    /*
     * Status header
     */

    document
        .getElementById("status")
        .innerText =
            `${validData.length} lokasi ditemukan`;

}


/* ============================================================
   RENDER MARKERS
============================================================ */

function renderMarkers(
    data
) {


    /*
     * Hapus marker lama
     */

    if (markerLayer) {

        map.removeLayer(
            markerLayer
        );

    }


    /*
     * Marker cluster
     */

    markerLayer =
        L.markerClusterGroup({

            showCoverageOnHover:
                false,

            maxClusterRadius:
                45

        });


    const bounds = [];


    /*
     * Buat marker setiap baris
     */

    data.forEach(
        row => {


            const longitude =
                parseFloat(
                    String(
                        row[
                            COL.longitude
                        ]
                    )
                    .replace(",", ".")
                );


            const latitude =
                parseFloat(
                    String(
                        row[
                            COL.latitude
                        ]
                    )
                    .replace(",", ".")
                );


            if (
                !Number.isFinite(
                    latitude
                )
                ||
                !Number.isFinite(
                    longitude
                )
            ) {

                return;

            }


            bounds.push([
                latitude,
                longitude
            ]);


            /*
             * Data Excel
             */

            const no =
                row[
                    COL.no
                ] || "-";


            const usaha =
                row[
                    COL.usaha
                ] || "Tidak ada nama";


            const lokasi =
                row[
                    COL.lokasi
                ] || "-";


            const pelanggaran =
                row[
                    COL.pelanggaran
                ] || "-";


            const upt =
                row[
                    COL.upt
                ] || "-";


            const tl =
                row[
                    COL.tl
                ] || "-";


            const kegiatan =
                row[
                    COL.kegiatan
                ] || "-";


            /*
             * Marker
             */

            const marker =
                L.circleMarker(
                    [
                        latitude,
                        longitude
                    ],
                    {

                        radius: 8,

                        fillColor:
                            "#0f766e",

                        color:
                            "#ffffff",

                        weight: 2,

                        opacity: 1,

                        fillOpacity:
                            0.9

                    }
                );


            /*
             * Google Maps
             */

            const googleMapsURL =
                "https://www.google.com/maps/search/?api=1&query=" +
                latitude +
                "," +
                longitude;


            /*
             * Popup
             */

            const popupHTML = `

                <div
                    style="
                        min-width:320px;
                        max-width:380px;
                    "
                >

                    <div
                        class="popup-title"
                    >

                        ${escapeHTML(
                            usaha
                        )}

                    </div>


                    <table
                        class="popup-table"
                    >


                        <tr>

                            <td>
                                No.
                            </td>

                            <td>
                                ${escapeHTML(
                                    no
                                )}
                            </td>

                        </tr>


                        <tr>

                            <td>
                                Pelaku Usaha
                            </td>

                            <td>
                                ${escapeHTML(
                                    usaha
                                )}
                            </td>

                        </tr>


                        <tr>

                            <td>
                                Lokasi
                            </td>

                            <td>
                                ${escapeHTML(
                                    lokasi
                                )}
                            </td>

                        </tr>


                        <tr>

                            <td>
                                Indikasi Pelanggaran
                            </td>

                            <td>
                                ${escapeHTML(
                                    pelanggaran
                                )}
                            </td>

                        </tr>


                        <tr>

                            <td>
                                UPT PSDKP
                            </td>

                            <td>
                                ${escapeHTML(
                                    upt
                                )}
                            </td>

                        </tr>


                        <tr>

                            <td>
                                TL Pengawasan
                            </td>

                            <td>
                                ${escapeHTML(
                                    tl
                                )}
                            </td>

                        </tr>


                        <tr>

                            <td>
                                Bentuk Kegiatan
                            </td>

                            <td>
                                ${escapeHTML(
                                    kegiatan
                                )}
                            </td>

                        </tr>


                        <tr>

                            <td>
                                Longitude
                            </td>

                            <td>
                                ${longitude.toFixed(6)}
                            </td>

                        </tr>


                        <tr>

                            <td>
                                Latitude
                            </td>

                            <td>
                                ${latitude.toFixed(6)}
                            </td>

                        </tr>


                    </table>


                    <a
                        class="maps-button"
                        href="${googleMapsURL}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        📍 Buka di Google Maps

                    </a>


                </div>

            `;


            marker.bindPopup(
                popupHTML
            );


            markerLayer.addLayer(
                marker
            );

        }
    );


    /*
     * Tambahkan marker ke peta
     */

    map.addLayer(
        markerLayer
    );


    /*
     * Zoom otomatis ke semua titik
     */

    if (
        bounds.length > 0
    ) {

        map.fitBounds(
            bounds,
            {
                padding: [
                    40,
                    40
                ]
            }
        );

    }

}


/* ============================================================
   SEARCH + FILTER
============================================================ */

function applyFilter() {


    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();


    const upt =
        document
            .getElementById(
                "uptFilter"
            )
            .value
            .toLowerCase()
            .trim();


    const filtered =
        validData.filter(
            row => {


                /*
                 * Data pencarian
                 */

                const usaha =
                    String(
                        row[
                            COL.usaha
                        ] || ""
                    )
                    .toLowerCase();


                const lokasi =
                    String(
                        row[
                            COL.lokasi
                        ] || ""
                    )
                    .toLowerCase();


                const pelanggaran =
                    String(
                        row[
                            COL.pelanggaran
                        ] || ""
                    )
                    .toLowerCase();


                const kegiatan =
                    String(
                        row[
                            COL.kegiatan
                        ] || ""
                    )
                    .toLowerCase();


                const rowUPT =
                    String(
                        row[
                            COL.upt
                        ] || ""
                    )
                    .toLowerCase();


                /*
                 * Search
                 */

                const matchSearch =

                    !search

                    ||

                    usaha.includes(
                        search
                    )

                    ||

                    lokasi.includes(
                        search
                    )

                    ||

                    pelanggaran.includes(
                        search
                    )

                    ||

                    kegiatan.includes(
                        search
                    );


                /*
                 * Filter UPT
                 */

                const matchUPT =

                    !upt

                    ||

                    rowUPT === upt;


                return (
                    matchSearch
                    &&
                    matchUPT
                );

            }
        );


    /*
     * Render ulang
     */

    renderMarkers(
        filtered
    );


    /*
     * Update status
     */

    document
        .getElementById("status")
        .innerText =
            `${filtered.length} lokasi ditampilkan`;

}


/* ============================================================
   SEARCH EVENT
============================================================ */

document
    .getElementById("search")
    .addEventListener(
        "input",
        applyFilter
    );


/* ============================================================
   FILTER UPT EVENT
============================================================ */

document
    .getElementById("uptFilter")
    .addEventListener(
        "change",
        applyFilter
    );


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ============================================================
   START
============================================================ */

loadExcel();

</script>
